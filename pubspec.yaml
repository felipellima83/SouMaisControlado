name: finance_app
description: "App de Controle Financeiro Offline - Sou Mais Controlado"
publish_to: 'none'
version: 1.2.2+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  local_auth: ^2.2.0
  path_provider: ^2.1.2
  quick_actions: ^1.1.0
  pdf: ^3.10.8

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
