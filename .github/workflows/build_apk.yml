name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar arquivos nativos do Android
        run: |
          flutter create --platforms=android .
          sed -i 's/android:label=".*"/android:label="Sou Mais Controlado"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<manifest .*/&\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>/' android/app/src/main/AndroidManifest.xml
          find android/app/src/main/ -name "MainActivity.kt" -exec sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' {} +
          find android/app/src/main/ -name "MainActivity.kt" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/' {} +

      - name: Baixar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Salvar APK para download
        uses: actions/upload-artifact@v5
        with:
          name: app-financeiro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
