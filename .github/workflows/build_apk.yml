name: Build Android APK e Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar arquivos nativos do Android
        run: |
          flutter create --platforms=android --org br.com.soumaiscontrolado.online .
          sed -i 's/android:label=".*"/android:label="Sou Mais Controlado Online"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<manifest .*/&\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<manifest .*/&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' android/app/src/main/AndroidManifest.xml
          find android/app/src/main/ -name "MainActivity.kt" -exec sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' {} +
          find android/app/src/main/ -name "MainActivity.kt" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/' {} +

      - name: Baixar dependencias
        run: flutter pub get

      - name: Gerar Icone do App
        run: dart run flutter_launcher_icons

      - name: Compilar APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build apk --release --dart-define="SUPABASE_URL=$(echo "$SUPABASE_URL" | tr -d '\r\n')" --dart-define="SUPABASE_ANON_KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '\r\n')"

      - name: Salvar APK para download
        uses: actions/upload-artifact@v5
        with:
          name: app-financeiro-online-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_and_deploy_web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar arquivos Web
        run: flutter create --platforms=web .

      - name: Baixar dependencias
        run: flutter pub get

      - name: Compilar Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build web --release --base-href "/SouMaisControlado/" --dart-define="SUPABASE_URL=$(echo "$SUPABASE_URL" | tr -d '\r\n')" --dart-define="SUPABASE_ANON_KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '\r\n')"
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
